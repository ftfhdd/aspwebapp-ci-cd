name: razorpages build outside of docker

on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

jobs:
    build:
        name: build and test outside of docker

        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: setup .net
              uses: actions/setup-dotnet@v3
              with:
                 dotnet-version: '7.0.x'

            - name: restore dependencies
              run: dotnet restore "./webappRazorpages/webapp Razor pages.csproj"

            - name: build 
              run: dotnet build "./webappRazorpages/webapp Razor pages.csproj" --no-restore --configuration Release

            - name: publish artifacts
              run: dotnet publish  "./webappRazorpages/webapp Razor pages.csproj" --no-build --configuration Release --output ./publish
            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with:
                 name: publish
                 path: ${{ github.workspace }}/publish


    package-publish-docker-image:

        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: checkout code
              uses: actions/checkout@v3
              
            - name: download artifacts
              uses: actions/download-artifact@v4
              with:
                name: publish
                path: ${{ github.workspace }}/publish

            - name: login to docker hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
                
            - name: build and push docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: webappRazorpages/Dockerfile
# here we are not using file because the dockerfile is in the root of the repo and context . will find it
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/razorpages:latest
# even though you added context docker build action look for dockerfile in context 
#but without looking source code it will show empty workspace
        

            

        

              

